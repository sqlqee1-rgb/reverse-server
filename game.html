<script>
/* REVERSE — pure game logic. No DOM. Deterministic given the seed.
 * Board: 5x5, cells 0..24 (row-major).
 *   outer ring (16 cells) turns clockwise, inner ring (8 cells) counter-clockwise, core (12) never moves.
 * Turn:
 *   1. place the current tile on an empty cell
 *   2. instant merge: equal tiles touching the placed one fuse into it (v * 2^(k-1)), repeats while it keeps matching
 *   3. the rings turn one step (REVERSE booster flips both directions for this turn)
 *   4. gear merges: every group of equal neighbours fuses, x2 points, repeats until stable
 */
(function (root) {
  'use strict';

  var N = 5, CELLS = 25, CORE = 12;
  var OUTER = [0, 1, 2, 3, 4, 9, 14, 19, 24, 23, 22, 21, 20, 15, 10, 5]; // clockwise order
  var INNER = [6, 7, 8, 13, 18, 17, 16, 11];                              // clockwise order
  var RING = [], RIDX = [], NB = [];
  OUTER.forEach(function (c, i) { RING[c] = 'o'; RIDX[c] = i; });
  INNER.forEach(function (c, i) { RING[c] = 'i'; RIDX[c] = i; });
  RING[CORE] = 'c'; RIDX[CORE] = 0;
  for (var c = 0; c < CELLS; c++) {
    var r = (c / N) | 0, k = c % N, n = [];
    if (r > 0) n.push(c - N);
    if (r < N - 1) n.push(c + N);
    if (k > 0) n.push(c - 1);
    if (k < N - 1) n.push(c + 1);
    NB[c] = n;
  }
  var BOOSTERS = ['reverse', 'swap', 'hammer'];
  var BOOSTER_CAP = 3;

  /* ---------- rng (mulberry32, state kept in the game state so saves resume exactly) ---------- */
  function rand(st) {
    st.rs = (st.rs + 0x6D2B79F5) >>> 0;
    var t = st.rs;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function hashSeed(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }

  /* ---------- geometry ---------- */
  function dest(cell, rev) {
    var ring = RING[cell];
    if (ring === 'o') return OUTER[(RIDX[cell] + (rev ? 15 : 1)) % 16];
    if (ring === 'i') return INNER[(RIDX[cell] + (rev ? 1 : 7)) % 8];
    return cell;
  }
  function dist(c) { return Math.abs(((c / N) | 0) - 2) + Math.abs((c % N) - 2); }

  /* ---------- spawning ---------- */
  var BALANCE = {
    base: [[2, 50], [4, 33], [8, 17]],
    tiers: [[256, 16, 9], [1024, 32, 7], [4096, 64, 5]], // [maxTile reached, value, weight]
    ramp: [],                                             // [moves made, value, weight]
    startTiles: 4,
    firstMilestone: 64,
    bolt: { first: 10, every: 10, min: 4, faster: 30, keepFree: 3, bonus: 25 },
    duel: { seconds: 150, maxHit: 4 }
  };
  function spawn(st) {
    var table = BALANCE.base.slice();
    BALANCE.tiers.forEach(function (t) { if (st.maxTile >= t[0]) table.push([t[1], t[2]]); });
    BALANCE.ramp.forEach(function (t) { if (st.moves >= t[0]) table.push([t[1], t[2]]); });
    var total = 0; table.forEach(function (e) { total += e[1]; });
    var x = rand(st) * total;
    for (var i = 0; i < table.length; i++) { x -= table[i][1]; if (x < 0) return table[i][0]; }
    return table[0][0];
  }

  /* ---------- state ---------- */
  function newGame(opts) {
    opts = opts || {};
    var seed = opts.seed != null ? (opts.seed >>> 0) : ((Math.random() * 4294967296) >>> 0);
    var st = {
      ver: 1, mode: opts.mode || 'classic', day: opts.day || null, seed: seed, rs: seed,
      rules: opts.rules || null,
      board: new Array(CELLS).fill(null), queue: [], score: 0, moves: 0, maxTile: 0, nextId: 1,
      boosters: { reverse: 1, swap: 1, hammer: 1 }, rewardIdx: 0,
      nextMilestone: BALANCE.firstMilestone, reverseArmed: false, jammed: false, over: false,
      nextBolt: BALANCE.bolt.first,
      run: { merges: 0, gear: 0, core: 0, bestCombo: 0, used: 0, reverses: 0, bolts: 0 }
    };
    var free = [];
    for (var c = 0; c < CELLS; c++) if (c !== CORE) free.push(c);
    var placed = 0, guard = 0;
    while (placed < BALANCE.startTiles && guard++ < 200) {
      var cell = free.splice((rand(st) * free.length) | 0, 1)[0];
      var v = [2, 4, 8][(rand(st) * 3) | 0];
      if (NB[cell].some(function (n) { return st.board[n] && st.board[n].v === v; })) { free.push(cell); continue; }
      st.board[cell] = { id: st.nextId++, v: v };
      st.maxTile = Math.max(st.maxTile, v);
      placed++;
    }
    for (var i = 0; i < 3; i++) st.queue.push(spawn(st));
    if (st.rules && st.rules.bolts === false) st.nextBolt = 1e12;
    if (st.rules && st.rules.hammer === false) st.boosters.hammer = 0;
    return st;
  }

  function clone(st) { return JSON.parse(JSON.stringify(st)); }
  function empties(st) { var e = []; for (var c = 0; c < CELLS; c++) if (!st.board[c]) e.push(c); return e; }

  function component(board, start) {
    var t = board[start]; if (!t || !t.v) return [];
    var seen = {}, out = [], stack = [start]; seen[start] = 1;
    while (stack.length) {
      var c = stack.pop(); out.push(c);
      NB[c].forEach(function (n) {
        if (!seen[n] && board[n] && board[n].v === t.v) { seen[n] = 1; stack.push(n); }
      });
    }
    return out;
  }
  function allGroups(board) {
    var seen = {}, groups = [];
    for (var c = 0; c < CELLS; c++) {
      if (!board[c] || !board[c].v || seen[c]) continue;
      var g = component(board, c);
      g.forEach(function (x) { seen[x] = 1; });
      if (g.length >= 2) groups.push(g);
    }
    return groups;
  }
  function fuse(st, group, anchor, combo, gear) {
    var b = st.board, base = b[anchor].v;
    var nv = base * Math.pow(2, group.length - 1);
    var core = group.indexOf(CORE) >= 0;
    var pts = nv * combo * (gear ? 2 : 1) * (core ? 2 : 1);
    var from = [], broke = [];
    group.forEach(function (c) {
      NB[c].forEach(function (n) {
        if (b[n] && !b[n].v) { broke.push({ id: b[n].id, cell: n }); b[n] = null; }
      });
    });
    pts += broke.length * BALANCE.bolt.bonus * combo;
    st.run.bolts = (st.run.bolts || 0) + broke.length;
    group.forEach(function (c) { if (c !== anchor) { from.push({ id: b[c].id, cell: c }); b[c] = null; } });
    b[anchor] = { id: b[anchor].id, v: nv };
    st.score += pts;
    st.maxTile = Math.max(st.maxTile, nv);
    st.run.merges++;
    if (gear) st.run.gear++;
    if (core) st.run.core++;
    return { to: anchor, id: b[anchor].id, from: from, broke: broke, base: base, v: nv, size: group.length, pts: pts, core: core };
  }

  function grantRewards(st, events) {
    while (st.maxTile >= st.nextMilestone) {
      var kind = null;
      for (var tries = 0; tries < 3; tries++) {
        var k = BOOSTERS[st.rewardIdx % 3]; st.rewardIdx++;
        if (k === 'hammer' && st.rules && st.rules.hammer === false) continue;
        if (st.boosters[k] < BOOSTER_CAP) { kind = k; break; }
      }
      if (kind) st.boosters[kind]++;
      else st.score += st.nextMilestone;
      events.push({ type: 'reward', kind: kind, at: st.nextMilestone, bonus: kind ? 0 : st.nextMilestone });
      st.nextMilestone *= 2;
    }
  }

  /* rusty bolts: dead cells that turn with the rings; a merge next to one breaks it */
  function dropBolt(st, ev) {
    var B = BALANCE.bolt;
    if (st.nextBolt == null) st.nextBolt = B.first;
    if (st.moves < st.nextBolt) return;
    var free = empties(st).filter(function (c) { return c !== CORE; });
    if (free.length < B.keepFree) return;
    var cell = free[(rand(st) * free.length) | 0];
    var t = { id: st.nextId++, v: 0 };
    st.board[cell] = t;
    st.nextBolt = st.moves + Math.max(B.min, B.every - Math.floor(st.moves / B.faster));
    ev.push({ type: 'bolt', cell: cell, id: t.id });
  }

  /* one full turn. returns the list of events for the animator */
  function place(st, cell) {
    if (st.over || st.jammed || st.board[cell]) return null;
    var ev = [], combo = 0;
    var v = st.queue.shift(); st.queue.push(spawn(st));
    var t = { id: st.nextId++, v: v };
    st.board[cell] = t;
    ev.push({ type: 'place', cell: cell, id: t.id, v: v });

    // phase A: instant merges around the placed tile
    for (;;) {
      var g = component(st.board, cell);
      if (g.length < 2) break;
      combo++;
      ev.push({ type: 'merge', gear: false, combo: combo, groups: [fuse(st, g, cell, combo, false)] });
    }

    // phase B: the gears turn
    var rev = st.reverseArmed; st.reverseArmed = false;
    if (rev) st.run.reverses++;
    var nb = new Array(CELLS).fill(null), moves = [];
    for (var c = 0; c < CELLS; c++) {
      if (!st.board[c]) continue;
      var d = dest(c, rev);
      nb[d] = st.board[c];
      if (d !== c) moves.push({ id: st.board[c].id, from: c, to: d });
    }
    st.board = nb;
    ev.push({ type: 'rotate', rev: rev, moves: moves });

    // phase C: gear merges cascade
    for (;;) {
      var groups = allGroups(st.board);
      if (!groups.length) break;
      combo++;
      var res = groups.map(function (gr) {
        var anchor = gr.slice().sort(function (a, b) {
          if (a === CORE) return -1; if (b === CORE) return 1;
          return dist(a) - dist(b) || st.board[b].id - st.board[a].id;
        })[0];
        return fuse(st, gr, anchor, combo, true);
      });
      ev.push({ type: 'merge', gear: true, combo: combo, groups: res });
    }
    st.run.bestCombo = Math.max(st.run.bestCombo, combo);
    st.moves++;
    grantRewards(st, ev);
    dropBolt(st, ev);

    if (!empties(st).length) {
      if (st.boosters.hammer > 0 && !(st.rules && st.rules.hammer === false)) { st.jammed = true; ev.push({ type: 'jam' }); }
      else { st.over = true; ev.push({ type: 'over' }); }
    }
    return ev;
  }

  function hammer(st, cell) {
    if (st.over || st.boosters.hammer <= 0 || !st.board[cell]) return null;
    var t = st.board[cell];
    st.board[cell] = null;
    st.boosters.hammer--; st.run.used++;
    st.jammed = false;
    return [{ type: 'hammer', cell: cell, id: t.id, v: t.v }];
  }
  function swap(st) {
    if (st.over || st.jammed || st.boosters.swap <= 0) return null;
    var q = st.queue; var a = q[0]; q[0] = q[1]; q[1] = a;
    st.boosters.swap--; st.run.used++;
    return [{ type: 'swap' }];
  }
  function toggleReverse(st) {
    if (st.over || st.jammed) return null;
    if (st.reverseArmed) { st.reverseArmed = false; st.boosters.reverse++; st.run.used--; }
    else { if (st.boosters.reverse <= 0) return null; st.reverseArmed = true; st.boosters.reverse--; st.run.used++; }
    return [{ type: 'reverse', armed: st.reverseArmed }];
  }
  function giveUp(st) { st.jammed = false; st.over = true; return [{ type: 'over' }]; }

  /* what would happen if the current tile went to `cell` */
  function preview(st, cell) {
    if (st.over || st.jammed || st.board[cell]) return null;
    var s = clone(st), ev = place(s, cell), pts = 0, instant = [], gear = [], land = cell, finalV = st.queue[0];
    var placedId = s.nextId - 1;
    ev.forEach(function (e) {
      if (e.type === 'merge') e.groups.forEach(function (g) {
        pts += g.pts;
        g.from.forEach(function (f) { (e.gear ? gear : instant).push(f.id); });
        (e.gear ? gear : instant).push(g.id);
        if (g.id === placedId) finalV = g.v;
      });
      if (e.type === 'rotate') e.moves.forEach(function (m) { if (m.id === placedId) land = m.to; });
    });
    return { pts: pts, instant: instant, gear: gear, land: land, value: finalV, placedId: placedId };
  }

  /* ---------- duel helpers ---------- */
  // bolts a move sends to the opponent: every merge step after the first in one move is one bolt,
  // and every gear (rotation) merge step adds one more
  function attack(ev) {
    var steps = 0, gear = 0;
    (ev || []).forEach(function (e) { if (e.type === 'merge') { steps++; if (e.gear) gear++; } });
    return Math.min(BALANCE.duel.maxHit, Math.max(0, steps - 1) + gear);
  }
  // garbage never fills the last free cell: you only lose by filling the board yourself
  function pickGarbage(st, n, rnd) {
    var free = empties(st).filter(function (c) { return c !== CORE; }), out = [];
    var room = Math.max(0, empties(st).length - 1);
    n = Math.min(n, room, free.length);
    for (var i = 0; i < n; i++) out.push(free.splice((rnd() * free.length) | 0, 1)[0]);
    return out;
  }
  function addBolts(st, cells) {
    var ev = [];
    cells.forEach(function (c) {
      if (st.board[c]) return;
      var t = { id: st.nextId++, v: 0 };
      st.board[c] = t; ev.push({ type: 'bolt', cell: c, id: t.id, garbage: true });
    });
    return ev;
  }
  // owner mode (enabled only by the server for one secret key): double points, and the board never jams —
  // when it gets tight, bolts and then the smallest tiles are cleared. Deterministic on purpose.
  function bossAssist(st, ev) {
    var gained = 0, removed = [];
    (ev || []).forEach(function (e) { if (e.type === 'merge') e.groups.forEach(function (g) { gained += g.pts; }); });
    st.score += gained;
    if (empties(st).length <= 2) {

      privacyTitle: 'Конфиденциальность',
      privacyBody: '<p>Без рекламы, аналитики и трекеров. Данные не продаются и не передаются третьим лицам.</p><h3>Онлайн-аккаунт</h3><p>При первом входе в онлайн-режим создаётся анонимный аккаунт, без e-mail и телефона. На сервере хранятся ник, аватар, страна, рейтинг, статистика, история матчей, друзья, сообщения и жалобы. Профиль и статус «в сети» видны другим игрокам.</p><h3>Чат</h3><p>Общий чат хранится 7 дней, личные сообщения — пока есть аккаунт. Сообщения фильтруются, любого можно заблокировать или пожаловаться на него. Жалобы проверяет модератор.</p><h3>Значки и поддержка</h3><p>Значки за места в топе и уровень поддержки хранятся в профиле. Платежи обрабатывает Google Play, игра видит только факт покупки.</p><h3>Страна</h3><p>Определяется один раз по IP-адресу, с точностью до страны. Сам IP в базу не записывается. Сменить страну можно в профиле раз в 30 дней.</p><h3>Матчи</h3><p>Ходы передаются на сервер для проверки и не сохраняются после матча. Соединение шифруется.</p><h3>Удаление</h3><p>Профиль → «Удалить онлайн-аккаунт» сразу удаляет профиль, рейтинг, друзей и сообщения с сервера. Без телефона: reverse-duel.onrender.com/delete-account и код переноса.</p><h3>На устройстве</h3><p>Рекорды одиночной игры, статистика, достижения и настройки хранятся только на телефоне. Удалить: «Сбросить прогресс» или удалить приложение.</p><h3>Разрешения</h3><p>Вибрация — для тактильной отдачи. Интернет — только для онлайн-режима.</p><h3>Контакты</h3><p>Через страницу игры в Google Play. Полная версия: reverse-duel.onrender.com/privacy</p>',

<script>
/* REVERSE — local profile: settings, stats, achievements, saves. Everything stays on the device. */

  'use strict';

    streak: 0, lastDaily: null, dailyBest: {} };

  var ACH = [
    { id: 'first', icon: 'gear', test: function (s) { return s.games >= 1; } },
    { id: 'gear', icon: 'ring', test: function (s, r) { return s.gear >= 1 || (r && r.run.gear >= 1); } },
    { id: 'combo3', icon: 'bolt', test: function (s, r) { return s.bestCombo >= 3 || (r && r.run.bestCombo >= 3); } },
    { id: 'combo5', icon: 'flame', test: function (s, r) { return s.bestCombo >= 5 || (r && r.run.bestCombo >= 5); } },
    { id: 't256', icon: 'tri', test: function (s, r) { return s.bestTile >= 256 || (r && r.maxTile >= 256); } },
    { id: 't1024', icon: 'diamond', test: function (s, r) { return s.bestTile >= 1024 || (r && r.maxTile >= 1024); } },
    { id: 't2048', icon: 'crown', test: function (s, r) { return s.bestTile >= 2048 || (r && r.maxTile >= 2048); } },
    { id: 'core', icon: 'plus', test: function (s, r) { return r && r.run.core >= 10; } },
    { id: 'bolts', icon: 'nut', test: function (s, r) { return s.bolts + (r ? r.run.bolts || 0 : 0) >= 25; } },
    { id: 'rev', icon: '#i-rev', test: function (s, r) { return s.reverses + (r ? r.run.reverses : 0) >= 5; } },
    { id: 's10k', icon: 'star', test: function (s, r) { return s.best >= 10000 || (r && r.score >= 10000); } },
    { id: 's50k', icon: '#i-cup', test: function (s, r) { return s.best >= 50000 || (r && r.score >= 50000); } },
    { id: 'pure', icon: 'moon', test: function (s, r) { return r && r.run.used === 0 && r.score >= 5000; } },
    { id: 'daily3', icon: '#i-cal', test: function (s) { return s.streak >= 3; } },
    { id: 'games10', icon: '#i-play', test: function (s) { return s.games >= 10; } },
    { id: 'duelWin', icon: '#i-swords', test: function (s) { return (s.duelWins || 0) >= 1; } },
    { id: 'duelKo', icon: 'wave', test: function (s) { return (s.duelKO || 0) >= 1; } }
  ];

  var P = {
    settings: Object.assign({}, DEF_SETTINGS, get('settings', {})),
    stats: Object.assign({}, DEF_STATS, get('stats', {})),
    ach: get('ach', {}),
    tutorialDone: get('tutorial', false),
    ACH: ACH,
    saveSettings: function () { set('settings', this.settings); },
    saveStats: function () { set('stats', this.stats); },
    name: function () {
      if (!this.settings.name) { this.settings.name = (I18N.get() === 'ru' ? 'Игрок ' : 'Player ') + (1000 + Math.floor(Math.random() * 9000)); this.saveSettings(); }
      return this.settings.name;
    },
    setName: function (n) {
      n = String(n || '').replace(/[\u0000-\u001f<>&"]/g, '').replace(/\s+/g, ' ').trim().slice(0, 14);

    markTutorial: function () { this.tutorialDone = true; set('tutorial', true); },
    /* returns achievements newly unlocked by the profile + (optionally) a live run */
    checkAch: function (run) {

        if (ok) { self.ach[a.id] = Date.now(); fresh.push(a); }

    saveGame: function (st) { if (st && !st.over) set('save.' + st.mode, st); else if (st) del('save.' + st.mode); },
    dropGame: function (mode) { del('save.' + mode); },
    reset: function () {

      del('stats'); del('ach'); del('save.classic'); del('save.daily');
      this.stats.duels = 0; this.stats.duelWins = 0; this.stats.duelLosses = 0; this.stats.duelDraws = 0; this.stats.duelKO = 0;
    }
  };

  function dayDiff(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }
  P.today = function () {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  P.dayNumber = function (day) { return Math.max(1, dayDiff('2026-10-09', day)); };

  root.Profile = P;
})(this);

</script>

<script>
/* REVERSE — friends, presence, duel invitations, world chat, private messages, reports,

(function (root) {
  'use strict';
  var t = I18N.t, fmt = I18N.fmt;

  var SYS_AVA = '<span class="sys-ava">' + '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#ff8a3d" stroke-width="3.4" stroke-dasharray="15 2.3"/><circle cx="16" cy="16" r="5.6" fill="none" stroke="#3fd8f2" stroke-width="3" stroke-dasharray="7.5 1.3"/></svg></span>';

  var C = {
    unread: 0, requests: 0, owner: false, blocked: {}, friends: null, dms: null, tab: 'world', world: [], worldLoaded: false,
    convo: null, convoWith: null, convoCard: null, canWrite: false, challenge: null,

    init: function () {
      var self = this;
      $('bFriends').onclick = function () { self.openFriends(); };
      $('bChat').onclick = function () { self.openChat(); };
      $('frBack').onclick = $('chBack').onclick = $('dmBack').onclick = function () { UI.back(); };
      $('frAdd').onclick = function () { self.openAdd(); };
      $('afGo').onclick = function () { self.sendAdd(); };
      $('afInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') self.sendAdd(); });
      $('afInput').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); });
      $('chSeg').querySelectorAll('[data-ch]').forEach(function (b) { b.onclick = function () { self.setTab(b.getAttribute('data-ch')); }; });
      $('chSend').onclick = function () { self.sendWorld(); };
      $('chInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') self.sendWorld(); });
      $('dmSend').onclick = function () { self.sendDM(); };
      $('dmInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') self.sendDM(); });
      $('dmWho').onclick = function () { if (self.convoCard && self.convoCard.name) Social.openProfile(self.convoCard.id); };
      $('dmMore').onclick = function () { if (self.convoCard && self.convoCard.name) self.playerMenu(self.convoCard, {}); };
      $('rpGo').onclick = function () { self.sendReport(); };
      $('chMsgs').addEventListener('click', function (e) { self.msgTap(e, 'world'); });
      $('dmMsgs').addEventListener('click', function (e) { self.msgTap(e, 'dm'); });
      $('dmQuick').addEventListener('click', function (e) {
        var b = e.target.closest('[data-cmd]'); if (!b) return;

        self.requests = m.requests; self.unread = m.unread; self.owner = !!m.owner;

        if (UI.screen === 'friends') self.renderFriends();
      });

      Net.on('friend_ok', function (m) { UI.toast('#i-check', t('frOkToast', { n: m.who.name }), ''); });
      Net.on('friend_sent', function (m) {

      Net.on('reported', function () { UI.toast('#i-check', t('rpDone'), t('rpDoneSub')); });

      Net.on('challenge_wait', function (m) { self.challengeWait(m); });
      Net.on('challenge_no', function (m) {
        if (self.challenge && self.challenge.out) { self.challenge = null; if ($('ovChallenge').classList.contains('on')) UI.close(); }

      });
      Net.on('challenge_gone', function (m) {
        if (self.challenge && self.challenge.cid === m.cid) { self.challenge = null; if ($('ovChallenge').classList.contains('on')) UI.close(); UI.toast('#i-swords', t('cgGone'), ''); }
      });
      Net.on('start', function () { if (self.challenge) { self.challenge = null; clearInterval(self.cgTimer); } });
      Net.on('error', function (m) { self.onError(m); });
      Net.on('me', function () { if (UI.screen === 'chat') self.paintComposer(); });
      Net.on('welcome', function () { self.worldLoaded = false; if (UI.screen === 'chat') self.setTab(self.tab); if (UI.screen === 'friends') Net.send({ type: 'friends' }); });
      setInterval(function () { if (UI.screen === 'friends' && Net.ready()) Net.send({ type: 'friends' }); }, 15000);
    },

    paintCounts: function () {

      f.textContent = this.requests > 0 ? this.requests : ''; f.classList.toggle('on', this.requests > 0);

    },
    refreshCounts: function () { if (Net.ready()) Net.send({ type: 'social' }); },
    onShow: function (screen) {

        var id = this.convoWith;

        if (Net.ready()) Net.send({ type: 'dm_open', id: id });
      }
    },
    need: function () {
      if (Net.ready()) return true;
      Net.connect(); UI.toast('#i-wifi', t('netWait'), t('netWaitSub')); return false;
    },

    /* ---------- friends ---------- */
    openFriends: function () {
      if (UI.screen !== 'friends') Social.push();
      UI.show('friends'); Net.connect();
      this.renderFriends();
      if (Net.ready()) Net.send({ type: 'friends' });
    },
    frow: function (p, right, sub) {
      var st = p.status;
      return '<div class="frow" data-pid="' + esc(p.id) + '"><span class="fava">' + PX.avatarF(p, 44) + (st ? dot(st) : '') + '</span>' +

        '<span class="fact">' + (right || '') + '</span></div>';
    },
    renderFriends: function () {
      var self = this, d = this.friends, me = Net.me, body = $('frBody'), h = '';
      h += '<div class="my-id"><span class="mi-l">' + t('myId') + '</span><b>' + (me && me.sid ? PX.sidText(me.sid) : '— — —') + '</b>' +
        '<button class="mi-copy" id="frCopy">' + PX.glyph('#i-copy') + '<span>' + t('copyId') + '</span></button></div>' +
        '<p class="muted id-hint">' + t('myIdHint') + '</p>';
      if (!d) h += '<div class="pf-empty">' + PX.glyph('#i-wifi', 'big') + '<p>' + t(Net.status === 'online' ? 'loading' : 'offlineRank') + '</p></div>';
      else {
        var ib = function (id, icon, cls, title) { return '<button class="ib ' + (cls || '') + '" data-a="' + id + '" aria-label="' + esc(title || '') + '">' + PX.glyph(icon) + '</button>'; };
        if (d.incoming.length) {
          h += '<h3 class="sec">' + t('frIncoming') + ' · ' + d.incoming.length + '</h3><div class="flist">' + d.incoming.map(function (p) {

          }).join('') + '</div>';

        if (!d.list.length) h += '<div class="pf-empty sm">' + PX.glyph('#i-users', 'big') + '<p>' + t('frEmpty') + '</p></div>';
        else h += '<div class="flist">' + d.list.map(function (p) {
          var free = p.status && (p.status.s === 'online' || p.status.s === 'searching');
          return self.frow(p, (free ? ib('duel', '#i-swords', 'duel', t('challenge')) : '') + ib('msg', '#i-chat', '', t('write')));
        }).join('') + '</div>';
        if (d.outgoing.length) h += '<h3 class="sec">' + t('frOutgoing') + '</h3><div class="flist">' + d.outgoing.map(function (p) {
          return self.frow(p, '<button class="mini-btn" data-a="cancel">' + t('cancel') + '</button>', t('frWaiting'));
        }).join('') + '</div>';
        if (d.blocked.length) h += '<h3 class="sec">' + t('frBlocked') + '</h3><div class="flist">' + d.blocked.map(function (p) {
          return self.frow(p, '<button class="mini-btn" data-a="unblock">' + t('unblock') + '</button>', '');
        }).join('') + '</div>';
      }
      body.innerHTML = h;
      var copy = $('frCopy'); if (copy) copy.onclick = function () { if (me && me.sid) UI.shareText(String(me.sid), true); };
      body.querySelectorAll('.frow').forEach(function (row) {

          var a = b.getAttribute('data-a');
          if (a === 'yes' || a === 'no') Net.send({ type: 'friend_answer', id: id, ok: a === 'yes' });
          else if (a === 'cancel') Net.send({ type: 'friend_remove', id: id });
          else if (a === 'unblock') Net.send({ type: 'unblock', id: id });
          else if (a === 'msg') self.openDM(id);
          else if (a === 'duel') self.sendChallenge(id);
        };

    },
    openAdd: function () {
      $('afInput').value = ''; $('afErr').textContent = '';
      UI.open('addFriend'); setTimeout(function () { $('afInput').focus(); }, 250);
    },
    sendAdd: function () {
      var v = $('afInput').value.replace(/\D/g, '');

      if (!this.need()) return;

    },

    /* ---------- duel invitations ---------- */
    sendChallenge: function (id) { if (this.need()) Net.send({ type: 'challenge', id: id }); },
    challengeIn: function (m) {
      var self = this;
      if (Duel.live) { Net.send({ type: 'challenge_answer', cid: m.cid, ok: false }); return; }
      this.challenge = { cid: m.cid, out: false, from: m.from, ends: Date.now() + m.ttl };
      $('cgAva').innerHTML = PX.avatarF(m.from, 84);

      $('cgYes').onclick = function () {
        if (Game.st && !Game.isDuel()) Game.save();
        Net.send({ type: 'challenge_answer', cid: m.cid, ok: true }); UI.close();
      };
      $('cgNo').onclick = function () { Net.send({ type: 'challenge_answer', cid: m.cid, ok: false }); self.challenge = null; UI.close(); };
      this.openChallenge(m.ttl);
      Sound.play('ach'); FX.buzz([30, 60, 30]);
    },
    challengeWait: function (m) {
      var self = this;
      this.challenge = { cid: m.cid, out: true, to: m.to, ends: Date.now() + m.ttl };
      $('cgAva').innerHTML = PX.avatarF(m.to, 84);
      $('cgTitle').innerHTML = t('cgWait', { n: esc(m.to.name) });
      $('cgSub').textContent = t('cgWaitSub');
      $('cgActions').innerHTML = '<button class="btn" id="cgCancel">' + t('cancel') + '</button>';

      this.openChallenge(m.ttl);

    openChallenge: function (ttl) {
      var ring = $('cgRing'), self = this;
      ring.style.transition = 'none'; ring.style.strokeDashoffset = '0'; void ring.getBoundingClientRect();
      ring.style.transition = 'stroke-dashoffset ' + ttl + 'ms linear'; ring.style.strokeDashoffset = '100';
      if (!$('ovChallenge').classList.contains('on')) UI.open('challenge');
      clearInterval(this.cgTimer);
      this.cgTimer = setInterval(function () {

      }, 250);

    /* ---------- chat ---------- */
    openChat: function (tab) {
      if (UI.screen !== 'chat') Social.push();
      UI.show('chat'); Net.connect();
      this.setTab(tab || this.tab);
    },
    setTab: function (tab) {
      this.tab = tab;
      $('chSeg').querySelectorAll('[data-ch]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-ch') === tab); });
      $('chWorld').hidden = tab !== 'world'; $('chDms').hidden = tab !== 'dms';
      if (tab === 'world') { this.renderWorld(true); if (Net.ready() && !this.worldLoaded) Net.send({ type: 'chat_open' }); this.paintComposer(); }
      else { this.renderDMs(); if (Net.ready()) Net.send({ type: 'dms' }); }
    },
    paintComposer: function () {
      var me = Net.me, muted = me && me.mutedUntil > Date.now(), banned = me && me.bannedUntil > Date.now();
      $('chInput').disabled = !!(muted || banned);
      $('chInput').placeholder = banned ? t('bannedSub', { d: until(me.bannedUntil) }) : muted ? t('errMuted', { d: until(me.mutedUntil) }) : t('chPlaceholder');
    },
    worldMsg: function (m, prev) {
      if (m.kind === 'announce' || !m.from) return '<div class="ann">' + SYS_AVA + '<div><b>Reverse</b><span>' + esc(m.text) + '</span></div></div>';
      var me = Net.me, mine = me && m.from.id === me.id;
      var grp = prev && prev.from && prev.from.id === m.from.id && m.at - prev.at < 180000;
      return '<div class="msg' + (mine ? ' me' : '') + (grp ? ' grp' : '') + (m.from.badge ? ' b-' + m.from.badge : '') + '" data-mid="' + m.id + '" data-uid="' + esc(m.from.id) + '">' +
        (mine ? '' : '<span class="mava">' + (grp ? '' : PX.avatarF(m.from, 34)) + '</span>') +
        '<div class="mbody">' + (mine || grp ? '' : '<div class="mname">' + PX.tag(m.from, 14) + '</div>') +
        '<div class="bubble">' + esc(m.text) + '<time>' + hhmm(m.at) + '</time></div></div></div>';
    },
    renderWorld: function (scroll) {
      var self = this, box = $('chMsgs'), list = this.world.filter(function (m) { return !(m.from && self.blocked[m.from.id]); });
      if (!this.worldLoaded && !list.length) { box.innerHTML = '<div class="pf-empty">' + PX.glyph('#i-wifi', 'big') + '<p>' + t(Net.status === 'online' ? 'loading' : 'offlineRank') + '</p></div>'; return; }
      if (!list.length) { box.innerHTML = '<div class="pf-empty">' + PX.glyph('#i-chat', 'big') + '<p>' + t('chEmpty') + '</p></div>'; return; }
      box.innerHTML = '<p class="chat-rules">' + t('chRules') + '</p>' + list.map(function (m, i) { return self.worldMsg(m, list[i - 1]); }).join('');
      if (scroll) box.scrollTop = box.scrollHeight;
    },
    appendWorld: function (m) {
      if (m.from && this.blocked[m.from.id]) return;
      var box = $('chMsgs'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      if (box.querySelector('.pf-empty')) return this.renderWorld(true);
      var prev = this.world[this.world.length - 2];
      box.insertAdjacentHTML('beforeend', this.worldMsg(m, prev));
      if (near || (Net.me && m.from && m.from.id === Net.me.id)) box.scrollTop = box.scrollHeight;
    },
    sendWorld: function () {
      var v = $('chInput').value.trim();
      if (!v || !this.need()) return;

    },
    msgTap: function (e, where) {
      var pa = e.target.closest('.mava .ava, .mava .afr, .mname');
      var row = e.target.closest('.msg'); if (!row) return this.cardTap(e);
      var uid = row.getAttribute('data-uid'), mid = +row.getAttribute('data-mid');
      if (!uid || (Net.me && uid === Net.me.id)) return;
      if (pa) return Social.openProfile(uid);
      var m = (where === 'world' ? this.world : this.convo || []).filter(function (x) { return x.id === mid; })[0];
      var from = m && (m.from || this.convoCard);
      if (from) this.playerMenu(from, { msg: mid, text: m.text });
    },

    /* ---------- an action sheet for a player: profile, write, report, block ---------- */
    playerMenu: function (p, ctx) {
      var self = this, items = [], blocked = !!this.blocked[p.id];

      $('mnList').querySelectorAll('[data-i]').forEach(function (b) { b.onclick = function () { UI.close(); items[+b.getAttribute('data-i')][2](); }; });

    sendReport: function () {

    openDM: function (id) {

    renderConvo: function (scroll) {

      $('dmWho').innerHTML = id === 'admin' ? modAva() + '<span class="dmw"><b>' + t('modTitle') + '</b><small>' + t('modSub') + '</small></span>'
        : id === 'sys' ? SYS_AVA + '<span class="dmw"><b>Reverse</b><small>' + t('sysSub') + '</small></span>'
        : w && w.name ? '<span class="fava">' + PX.avatarF(w, 38) + dot(w.status) + '</span><span class="dmw"><b>' + PX.tag(w, 15) + '</b><small class="s-' + (w.status ? w.status.s : '') + '">' + PX.statusText(w.status) + '</small></span>' : '';
      $('dmMore').style.visibility = w && w.name ? '' : 'hidden';
      var admin = id === 'admin';
      $('dmQuick').innerHTML = admin ? ['/reports', '/stats', '/help'].map(function (c) { return '<button class="chip" data-cmd="' + c + '">' + c + '</button>'; }).join('') : '';
      $('dmQuick').hidden = !admin;

      else note.hidden = true;
      if (!this.convo) { box.innerHTML = '<div class="pf-empty">' + PX.glyph('#i-wifi', 'big') + '<p>' + t(Net.status === 'online' ? 'loading' : 'offlineRank') + '</p></div>'; return; }

    convoMsg: function (m) {
      var me = Net.me, mine = me && m.src === me.id;

      if (m.kind === 'sys') return '<div class="sysmsg' + (m.data && m.data.key === 'help' ? ' help' : '') + '" data-mid="' + m.id + '">' + this.sysText(m.data || {}) + '<time>' + hhmm(m.at) + '</time></div>';
      var cmd = this.convoWith === 'admin' && /^\//.test(m.text);
      return '<div class="msg' + (mine ? ' me' : '') + '" data-mid="' + m.id + '"' + (mine ? '' : ' data-uid="' + esc(m.src) + '"') + '><div class="mbody">' +
        '<div class="bubble' + (cmd ? ' cmd' : '') + '">' + esc(m.text) + '<time>' + hhmm(m.at) + '</time></div></div></div>';
    },
    sendDM: function () {
      var v = $('dmInput').value.trim();
      if (!v || !this.need() || !this.convoWith) return;
      Net.send({ type: 'say', to: this.convoWith, text: v }); $('dmInput').value = '';
    },
    onDM: function (m) {
      var me = Net.me, w = m.with.id, mine = me && m.msg.src === me.id;
      var open = UI.screen === 'dm' && this.convoWith === w;
      if (open && this.convo) {
        this.convo.push(m.msg);
        var box = $('dmMsgs');
        if (box.querySelector('.pf-empty')) this.renderConvo(true);
        else { box.insertAdjacentHTML('beforeend', this.convoMsg(m.msg)); box.scrollTop = box.scrollHeight; }
        if (!mine) Net.send({ type: 'dm_seen', id: w });
      } else if (!mine) {
        this.unread++; this.paintCounts();
        var title = w === 'admin' ? (m.msg.kind === 'report' ? t('newReport') : t('modTitle')) : w === 'sys' ? 'Reverse' : m.with.name;
        var sub = m.msg.kind === 'report' ? ((m.msg.data.target && m.msg.data.target.name) || '') + ' · ' + t('rp_' + m.msg.data.reason)
          : m.msg.kind === 'sys' ? this.sysText(m.msg.data || {}, true) : m.msg.kind === 'info' ? t('pvInfo') : m.msg.text;
        if (!(w === 'admin' && m.msg.kind === 'sys')) { UI.toast(w === 'admin' ? '#i-shield' : '#i-chat', title, sub); Sound.play('tap'); }
      }
      if (UI.screen === 'chat' && this.tab === 'dms') Net.send({ type: 'dms' });
      if (m.msg.kind === 'sys' && m.msg.data && /^(mute|unmute|ban|unban|rename|badge|unbadge|untop)$/.test(m.msg.data.key)) this.paintComposer();
    },

    /* ---------- moderation messages ---------- */
    sysText: function (d, plain) {
      var k = d.key, r;
      switch (k) {
        case 'ban': r = t('sys_ban', { d: until(d.until) }) + (d.reason ? ' ' + t('sys_reason', { r: d.reason }) : ''); break;
        case 'mute': r = t('sys_mute', { d: until(d.until) }); break;
        case 'rename': r = t('sys_rename', { o: d.old || '' }); break;
        case 'done': r = t('done_' + d.act, { n: d.name || '', id: PX.sidText(d.sid), d: d.dur ? durText(d.dur) : '', o: d.old || '' }); break;
        case 'stats': r = t('sys_stats', d); break;
        case 'reports': r = t('sys_reports', { n: d.n }); break;
        case 'usage': r = t('usage_' + d.cmd); break;
        case 'unknown': r = t('sys_unknown', { c: d.cmd || '' }); break;
        case 'no_player': r = t('sys_no_player', { r: d.ref || '' }); break;
        case 'owner_new': r = t('sys_owner_new', { n: d.name || '', id: PX.sidText(d.sid) }); break;
        case 'help': r = plain ? t('sys_help_short') : t('sys_help'); break;
        case 'donor': r = t('sys_donor', { t: t('bd_' + (d.t || 1)) }); break;
        case 'donation': r = t('sys_donation', { n: d.name || '', id: PX.sidText(d.sid), t: d.t, source: d.source || '' }); break;
        default: r = t('sys_' + k);
      }
      return plain ? String(r).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() : r;
    },
    playerHead: function (p) {
      return '<button class="mc-player" data-profile="' + esc(p.id) + '">' + PX.avatarF(p, 44) +
        '<span class="hmid"><span class="hn">' + PX.tag(p, 16) + (p.bot ? '<i class="tagbot">' + t('botTag') + '</i>' : '') + '</span>' +
        '<span class="hs">ID ' + PX.sidText(p.sid) + ' · ' + PX.tierLabel(p) + (PX.placed(p) ? ' ' + fmt(p.rating) : '') + '</span></span></button>';
    },
    actionButtons: function (p, rid) {
      var b = function (act, dur, label, cls) {
        return '<button class="ab ' + (cls || '') + '" data-act="' + act + '"' + (dur ? ' data-dur="' + dur + '"' : '') + (rid ? ' data-rid="' + rid + '"' : '') + ' data-target="' + esc(p.id) + '">' + label + '</button>';
      };
      return '<div class="ab-row"><span>' + t('abMute') + '</span>' + b('mute', '1h', t('dur_1h')) + b('mute', '1d', t('dur_1d')) + b('mute', '7d', t('dur_7d')) + '</div>' +
        '<div class="ab-row"><span>' + t('abBan') + '</span>' + b('ban', '1d', t('dur_1d'), 'red') + b('ban', '7d', t('dur_7d'), 'red') + b('ban', 'forever', t('dur_forever'), 'red') + '</div>' +
        '<div class="ab-row wide">' + b('rename', '', t('abRename')) + b('untop', '', t('abUntop')) + '</div>';
    },
    reportCard: function (m) {
      var d = m.data || {}, p = d.target || {}, open = d.state === 'open';
      var h = '<div class="mcard report' + (open ? '' : ' closed') + '" data-mid="' + m.id + '">' +
        '<div class="mc-head">' + PX.glyph('#i-flag') + '<b>' + t('reportN', { n: d.rid }) + '</b><span class="mc-reason">' + t('rp_' + d.reason) + '</span><time>' + hhmm(m.at) + '</time></div>' +
        this.playerHead(p) +
        (p.reports ? '<div class="mc-stats">' + t('mcReports', { n: p.reports.total, o: p.reports.open }) + (p.bannedUntil ? ' · ' + t('mcBanned', { d: until(p.bannedUntil) }) : '') +
          (p.mutedUntil ? ' · ' + t('mcMuted', { d: until(p.mutedUntil) }) : '') + '</div>' : '') +
        (d.context ? '<blockquote>' + esc(d.context) + '</blockquote>' : '') +
        (d.comment ? '<p class="mc-comment"><span>' + t('mcComment') + '</span> ' + esc(d.comment) + '</p>' : '') +
        (d.from ? '<p class="mc-from">' + t('mcFrom') + ' ' + PX.tag(d.from, false) + '</p>' : '');
      if (open) h += this.actionButtons(p, d.rid) +
        '<div class="ab-row wide"><button class="ab line" data-profile="' + esc(p.id) + '">' + t('openProfile') + '</button><button class="ab line" data-act="dismiss" data-rid="' + d.rid + '" data-target="' + esc(p.id) + '">' + t('abDismiss') + '</button></div>';
      else h += '<div class="mc-result ' + (d.state === 'rejected' ? 'no' : 'yes') + '">' + PX.glyph(d.state === 'rejected' ? '#i-x' : '#i-check') +
        '<span>' + (d.state === 'rejected' ? t('mcRejected') : t('mcDone_' + (d.action || 'x'), { d: d.dur ? durText(d.dur) : '' })) + '</span></div>';
      return h + '</div>';
    },
    infoCard: function (m) {
      var p = (m.data || {}).target || {}, r = p.reports || { total: 0, open: 0 };
      var stats = [[fmt(p.games || 0), t('stMatches')], [p.games ? Math.round(100 * (p.wins || 0) / p.games) + '%' : '—', t('stWinrate')], [String(r.total), t('mcReportsShort')]];
      return '<div class="mcard info" data-mid="' + m.id + '"><div class="mc-head">' + PX.glyph('#i-user') + '<b>' + t('mcPlayer') + '</b><time>' + hhmm(m.at) + '</time></div>' +
        this.playerHead(p) +
        '<div class="mc-grid">' + stats.map(function (s) { return '<div><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('') + '</div>' +
        '<div class="mc-stats">' + PX.statusText(p.status) + (p.created ? ' · ' + t('mcSince', { d: until(p.created).split(' ')[0] }) : '') +
        (p.bannedUntil ? ' · ' + t('mcBanned', { d: until(p.bannedUntil) }) : '') + (p.mutedUntil ? ' · ' + t('mcMuted', { d: until(p.mutedUntil) }) : '') + '</div>' +
        (p.link ? '<p class="mc-from">' + PX.glyph('#i-link') + ' ' + esc(p.link) + '</p>' : '') +
        this.actionButtons(p, null) +
        '<div class="ab-row"><span>' + PX.badgeIcon({ k: 'donor', t: 3 }, 18) + '</span>' + [1, 2, 3].map(function (n) {
          return '<button class="ab' + ((p.donor || 0) >= n ? ' on' : '') + '" data-act="donor" data-dur="' + n + '" data-target="' + esc(p.id) + '">' + t('bd_' + n) + '</button>';
        }).join('') + '</div>' +
        '<div class="ab-row wide">' + (p.rawBadge === 'inf' ? '<button class="ab" data-act="unbadge" data-target="' + esc(p.id) + '">' + t('abUnbadge') + '</button>'
          : '<button class="ab inf" data-act="badge" data-target="' + esc(p.id) + '">' + PX.badgeIcon('inf', 16) + t('abBadge') + '</button>') +
        (p.bannedUntil ? '<button class="ab" data-act="unban" data-target="' + esc(p.id) + '">' + t('abUnban') + '</button>' : '') +
        (p.mutedUntil ? '<button class="ab" data-act="unmute" data-target="' + esc(p.id) + '">' + t('abUnmute') + '</button>' : '') +
        '<button class="ab line" data-profile="' + esc(p.id) + '">' + t('openProfile') + '</button></div></div>';
    },
    cardTap: function (e) {
      var pr = e.target.closest('[data-profile]'); if (pr) return Social.openProfile(pr.getAttribute('data-profile'));
      var b = e.target.closest('[data-act]'); if (!b) return;
      var o = { type: 'admin', act: b.getAttribute('data-act'), target: b.getAttribute('data-target'), dur: b.getAttribute('data-dur') || undefined, rid: +b.getAttribute('data-rid') || undefined };
      var go = function () { Net.send(o); b.closest('.mcard').classList.add('busy'); };
      if (o.act === 'ban' && o.dur === 'forever') UI.confirm(t('banForeverAsk'), t('banForeverText'), t('abBan'), go, true);
      else go();
    },

    onError: function (m) {
      var map = { muted: ['#i-chat', 'errMuted'], slow: ['#i-chat', 'errSlow'], spam: ['#i-chat', 'errSpam'], not_friend: ['#i-users', 'errNotFriend'],
        cant_write: ['#i-block', 'errCantWrite'], friends_full: ['#i-users', 'errFriendsFull'], report_limit: ['#i-flag', 'errReportLimit'], banned: ['#i-x', 'errBanned'] };
      if ($('ovAddFriend').classList.contains('on') && /^(no_player|self|already|friends_full)$/.test(m.code)) { $('afErr').textContent = t('af_' + m.code); Sound.play('deny'); return; }
      var e = map[m.code]; if (!e) return;
      UI.toast(e[0], t(e[1], { d: until(m.until) }), '');
      if (m.code === 'muted' || m.code === 'banned') this.paintComposer();
    }
  };
  root.Community = C;
})(this);

<script>
/* REVERSE — badges everywhere (the menu player chip, the badge sheet, the profile stand) and the supporter shop. */
(function (root) {
  'use strict';
  var t = I18N.t;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return PX.esc(s); };
  var SKU = ['', 'support_1', 'support_2', 'support_3'];

  var B = {
    shop: null,
    init: function () {
      var self = this;
      // any badge, anywhere: tap it to see what it is
      document.addEventListener('click', function (e) {
        var b = e.target.closest('.bdg[data-b]');
        if (!b || e.target.closest('.bslot') || e.target.closest('#ovBadge')) return;
        e.preventDefault(); e.stopPropagation();
        try { self.openBadge(JSON.parse(b.getAttribute('data-b'))); } catch (x) { }
      }, true);
      $('meChip').onclick = function () { Social.openProfile(); };
      $('bShop').onclick = function () { self.openShop(); };
      $('shBack').onclick = function () { UI.back(); };
      Net.on('me', function () { self.paintChip(); if (UI.screen === 'shop') self.renderShop(); });
      Net.on('status', function () { self.paintChip(); });
      Net.on('shop', function (m) { self.shop = m; if (UI.screen === 'shop') self.renderShop(); });
      Net.on('purchase', function (m) {
        self.buying = null; if (UI.screen === 'shop') self.renderShop();
        if (m.ok) { Sound.play('reward'); FX.buzz([20, 40, 20]); self.openBadge({ k: 'donor', t: m.tier }, true); }
        else UI.toast('#i-x', t('buyFail'), t('buyFail_' + (m.reason === 'not_configured' ? 'cfg' : 'x')));
      });
      // the Android app reports Google Play results here
      root.__onPurchase = function (sku, token) { if (token) Net.send({ type: 'purchase', sku: sku, token: token, platform: 'play' }); };
      root.__onPurchaseFail = function (code) { self.buying = null; if (UI.screen === 'shop') self.renderShop(); if (code !== 'cancel') UI.toast('#i-x', t('buyFail'), ''); };
      this.paintChip();
    },

    /* ---------- the player chip on the menu: avatar, name, league, badges ---------- */
    paintChip: function () {
      var me = Net.me, el = $('meChip');
      if (!el) return;
      if (!me) { el.innerHTML = '<span class="ava ghost" style="--s:34px"></span><span class="mch"><b>' + esc(Profile.name()) + '</b><small>' + t(Net.status === 'online' ? 'loading' : 'offlineChip') + '</small></span>'; return; }
      el.innerHTML = PX.avatarF(me, 34) + '<span class="mch"><b>' + PX.tag(me, 16) + '</b><small>' + PX.tierLabel(me) + (PX.placed(me) ? ' · ' + I18N.fmt(me.rating) : '') + '</small></span>';
    },

    /* ---------- one badge, big ---------- */
    openBadge: function (b, fresh) {
      var info = PX.badgeInfo(b), rare = ['rareMythic', 'rareLegend', 'rareEpic', 'rareRare', 'rareCommon'][info.rare] || 'rareRare';
      $('bgArt').innerHTML = '<i class="bg-glow k-' + b.k + '"></i>' + PX.badgeIcon(b, 128, true);
      $('bgName').textContent = info.name;
      $('bgRare').className = 'bg-rare r' + info.rare; $('bgRare').textContent = t(rare);
      $('bgText').textContent = info.text;
      $('bgNote').textContent = fresh ? t('bdThanks') : info.note || '';
      var act = $('bgAct');
      if (b.locked && b.k === 'donor') { act.textContent = t('toShop'); act.onclick = function () { UI.close(); B.openShop(); }; }
      else { act.textContent = t('gotIt'); act.onclick = function () { UI.close(); }; }
      UI.open('badge');
      if (fresh) { Sound.play('ach'); }
    },

    /* ---------- the stand in a profile ---------- */
    standHTML: function (p, mine) {
      var have = PX.badgeList(p).length ? (p.badges || []) : (p.badge ? [{ k: p.badge }] : []);
      var items = have.slice();
      if (mine) {
        if (!have.some(function (b) { return b.k === 'donor'; })) items.push({ k: 'donor', t: 1, locked: true });
        if (!have.some(function (b) { return b.k === 'season'; })) items.push({ k: 'season', r: 100, s: Net.season ? Net.season.id : '2026-10', locked: true });
        if (!have.some(function (b) { return b.k === 'inf'; })) items.push({ k: 'inf', locked: true });
      }
      if (!items.length) return '';
      return '<h3 class="sec">' + t('standTitle') + (have.length ? ' · ' + have.length : '') + '</h3><div class="stand">' + items.map(function (b) {
        var info = PX.badgeInfo(b);
        return '<button class="bslot' + (b.locked ? ' locked' : '') + '" data-b="' + esc(JSON.stringify(b)) + '"><span class="ped">' + PX.badgeIcon(b, 54, !b.locked) + '</span>' +
          '<span class="bl">' + esc(b.locked ? t('lockedName_' + b.k) : info.name) + '</span></button>';
      }).join('') + '</div>';
    },
    wireStand: function (box) {
      var self = this;
      box.querySelectorAll('.bslot').forEach(function (s) {
        s.onclick = function () {
          var b = JSON.parse(s.getAttribute('data-b'));
          if (b.locked) {
            if (b.k === 'donor') return self.openShop();
            var info = { season: ['bs_4', 'bsHow'], inf: ['badge_inf', 'bText_inf'] }[b.k];
            return self.openBadge(b);
          }
          self.openBadge(b);
        };
      });
    },

    /* ---------- shop ---------- */
    openShop: function () {
      if (UI.screen !== 'shop') Social.push();
      UI.show('shop'); Net.connect();
      this.renderShop();
      if (Net.ready()) Net.send({ type: 'shop' });
    },
    platform: function () {
      if (root.Android && Android.billingBuy) return 'play';
      if (root.Android) return 'android';
      return 'web';
    },
    renderShop: function () {
      var self = this, me = Net.me, d = this.shop, tier = me ? me.donor || 0 : 0, plat = this.platform();
      var cur = (I18N.get() === 'ru') ? 'RUB' : 'USD';
      var h = '<div class="sh-hero"><div class="sh-hearts">' + PX.badgeIcon({ k: 'donor', t: 1 }, 54, true) + PX.badgeIcon({ k: 'donor', t: 3 }, 84, true) + PX.badgeIcon({ k: 'donor', t: 2 }, 54, true) + '</div>' +
        '<h2>' + t('shopHero') + '</h2><p>' + t('shopText') + '</p></div>';
      h += [1, 2, 3].map(function (n) {
        var prod = d && d.products ? d.products.filter(function (x) { return x.tier === n; })[0] : null;
        var price = self.prices && self.prices[SKU[n]] ? self.prices[SKU[n]] : prod ? prod.price[cur] : '';
        var owned = tier >= n, busy = self.buying === SKU[n];
        return '<div class="tier t' + n + (owned ? ' owned' : '') + '"><div class="tr-art">' + PX.badgeIcon({ k: 'donor', t: n }, 76, true) + '</div>' +
          '<div class="tr-body"><b>' + t('bd_' + n) + '</b><ul>' + t('perks_' + n).split('|').map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
          '<button class="tr-buy" data-n="' + n + '"' + (owned || busy ? ' disabled' : '') + '>' + (owned ? PX.glyph('#i-check') + t('owned') : busy ? t('buying') : esc(price || t('buy'))) + '</button></div></div>';
      }).join('');
      h += '<p class="sh-note">' + t('shopNote') + '</p>';
      if (plat === 'android') h += '<p class="sh-note warn">' + t('shopSoon') + '</p>';
      if (plat === 'web' && !(d && d.donateUrl)) h += '<p class="sh-note warn">' + t('shopSoonWeb') + '</p>';
      $('shBody').innerHTML = h;
      $('shBody').querySelectorAll('.tr-buy').forEach(function (b) { b.onclick = function () { self.buy(+b.getAttribute('data-n')); }; });
      if (plat === 'play' && !this.prices && Android.billingPrices) { try { Android.billingPrices(SKU.slice(1).join(',')); } catch (e) { } }
    },
    buy: function (n) {
      var me = Net.me, plat = this.platform(), d = this.shop;
      if (!me) { Net.connect(); UI.toast('#i-wifi', t('netWait'), t('netWaitSub')); return; }
      if (plat === 'play') { this.buying = SKU[n]; this.renderShop(); try { Android.billingBuy(SKU[n]); } catch (e) { this.buying = null; this.renderShop(); } return; }
      if (plat === 'web' && d && d.donateUrl) {
        UI.confirm(t('donateAsk', { n: t('bd_' + n) }), t('donateText', { id: PX.sidText(me.sid) }), t('donateGo'), function () { PX.openUrl(d.donateUrl); });
        return;
      }
      UI.toast('#i-gift', t('shopSoonT'), plat === 'android' ? t('shopSoon') : t('shopSoonWeb'));
    }
  };
  // Android reports localized Google Play prices here: {"support_1":"99 ₽", ...}
  root.__onPrices = function (json) { try { B.prices = JSON.parse(json); if (UI.screen === 'shop') B.renderShop(); } catch (e) { } };
  root.Badges = B;
})(this);

</script>
<script>
/* REVERSE — screens, menus, overlays, attract-mode demo, Android bridge hooks, boot */
(function (root) {
  'use strict';
  var L = root.Logic, t = I18N.t, fmt = I18N.fmt;
  var $ = function (id) { return document.getElementById(id); };
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  /* ---------- menu demo: a tiny board that plays itself ---------- */
  var Demo = {
    view: null, st: null, run: 0,
    mount: function () { this.view = new BoardView($('demo'), { mini: true }); this.fit(); },
    fit: function () { var w = $('demo').clientWidth; if (w) this.view.resize(w); },
    reset: function () {
      this.st = L.newGame({ mode: 'demo' });
      this.st.nextBolt = 1e9;
      for (var i = 0; i < 6; i++) { // pre-fill a little so the first turns already show merges
        var e = L.empties(this.st).filter(function (c) { return c !== L.CORE; });
        var c = e[(Math.random() * e.length) | 0], v = [2, 4, 8, 16][(Math.random() * 4) | 0];
        if (!L.NB[c].some(function (n) { return this.st.board[n] && this.st.board[n].v === v; }, this)) this.st.board[c] = { id: this.st.nextId++, v: v };
      }
      this.view.clear(); this.view.sync(this.st);
    },
    pick: function () {
      var st = this.st, v = st.queue[0], best = -1, bc = null;
      L.empties(st).forEach(function (c) {
        var p = L.preview(st, c), score = p.pts + (p.gear.length ? 50 : 0) + Math.random() * 6;
        if (score > best) { best = score; bc = c; }
      });
      return bc;
    },
    start: async function () {
      var my = ++this.run;
      this.fit();
      if (!this.st || this.st.over || this.st.moves > 40) this.reset();
      await wait(700);
      while (my === this.run) {
        if (this.st.over || this.st.moves > 40 || L.empties(this.st).length < 5) { this.reset(); await wait(900); continue; }
        var ev = L.place(this.st, this.pick());
        for (var i = 0; i < ev.length && my === this.run; i++) {
          if (ev[i].type === 'place' || ev[i].type === 'merge' || ev[i].type === 'rotate' || ev[i].type === 'bolt') await this.view.animate(ev[i]);
        }
        await wait(650);
      }
    },
    stop: function () { this.run++; }
  };

  var UI = {
    screen: 'splash', stack: [], toastQ: [], toastBusy: false, confirmCb: null,

    init: function () {
      var self = this;
      FX.mount();
      Demo.mount();
      Game.init();
      Duel.init();
      Social.init();
      Community.init();
      Badges.init();
      this.applySettings();
      document.addEventListener('pointerdown', function () {
        Sound.init();
        if (Profile.settings.music) Sound.music(true);
      }, true);
      document.addEventListener('click', function (e) {
        if (e.target.closest('button')) Sound.play('tap');
      }, true);

      // menu
      $('bPlay').onclick = function () {
        if (!Profile.tutorialDone) { self.show('game'); Game.startTutorial(); return; }
        var resume = !!Profile.loadGame('classic');
        self.show('game'); Game.start('classic', { resume: resume });
      };
      $('bNew').onclick = function () { Profile.dropGame('classic'); self.show('game'); Game.start('classic', {}); };
      $('bDaily').onclick = function () { self.show('game'); Game.start('daily', { resume: true }); };
      $('bSettings').onclick = function () { self.open('settings'); };

      // game
      $('bPause').onclick = function () { self.pause(); };
      $('pResume').onclick = function () { self.close(); };
      $('pRestart').onclick = function () {
        self.confirm(t('restartAsk'), t('restartText'), t('yesRestart'), function () {
          self.closeAll(); Profile.dropGame(Game.st.mode); Game.start(Game.st.mode, {});
        });
      };
      $('pSkip').onclick = function () { self.closeAll(); Game.finishTutorial(); };
      $('pSettings').onclick = function () { self.open('settings'); };
      $('pMenu').onclick = function () { self.closeAll(); Game.save(); Game.endTutorial(); self.show('menu'); };
      $('oAgain').onclick = function () { self.closeAll(); Game.start(Game.st.mode === 'daily' ? 'daily' : 'classic', {}); };
      $('oMenu').onclick = function () { self.closeAll(); self.show('menu'); };
      $('oShare').onclick = function () { self.share(); };
      $('jUse').onclick = function () { Game.useHammerFromJam(); };
      $('jGive').onclick = function () { Game.giveUp(); };

      // settings
      document.querySelectorAll('[data-set]').forEach(function (b) {
        b.onclick = function () {
          var k = b.getAttribute('data-set');
          Profile.settings[k] = !Profile.settings[k]; Profile.saveSettings();
          self.applySettings();
          if (k === 'vibe' && Profile.settings.vibe) FX.buzz(30);
        };
      });
      document.querySelectorAll('[data-lang]').forEach(function (b) {
        b.onclick = function () { Profile.settings.lang = b.getAttribute('data-lang'); Profile.saveSettings(); self.applySettings(); };
      });
      $('sTut').onclick = function () { self.closeAll(); self.show('game'); Game.startTutorial(); };
      $('sPrivacy').onclick = function () { self.open('privacy'); };
      $('sReset').onclick = function () {
        self.confirm(t('resetAsk'), t('resetText'), t('resetYes'), function () {
          Profile.reset(); self.closeAll(); self.toast('#i-reset', t('resetDone'), ''); if (self.screen === 'game') self.show('menu'); self.refreshMenu();
        }, true);
      };
      $('cYes').onclick = function () { var cb = self.confirmCb; self.close(); if (cb) cb(); };
      $('cNo').onclick = function () { self.close(); };
      document.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = function () { self.close(); }; });
      document.querySelectorAll('.overlay').forEach(function (o) {
        o.addEventListener('click', function (e) { if (e.target === o && o.id !== 'ovJam' && o.id !== 'ovOver') self.close(); });
      });

      // lifecycle (Android bridge calls these, browsers use visibility)
      root.__onBack = function () { self.back(); return true; };
      root.__onPause = function () { self.appPause(); };
      root.__onResume = function () { Sound.resume(); if (self.screen === 'menu') Demo.start(); };
      document.addEventListener('visibilitychange', function () { if (document.hidden) self.appPause(); else root.__onResume(); });
      root.addEventListener('resize', function () { Demo.fit(); });
      // iOS: block pinch zoom, and offer "Add to Home Screen" once when running in Safari
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      var standalone = navigator.standalone === true || (root.matchMedia && matchMedia('(display-mode: standalone)').matches);
      if (standalone) document.documentElement.classList.add('standalone');
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var dismissed = false; try { dismissed = !!localStorage.getItem('reverse.installTip'); } catch (e) { }
      if (ios && !standalone && !dismissed && location.protocol.indexOf('http') === 0) setTimeout(function () { $('installTip').classList.add('on'); }, 2600);
      $('installX').onclick = function () { $('installTip').classList.remove('on'); try { localStorage.setItem('reverse.installTip', '1'); } catch (e) { } };
    },

    applySettings: function () {
      var s = Profile.settings;
      I18N.set(s.lang || I18N.detect());
      I18N.apply();
      Sound.setSfx(s.sound); Sound.setMusic(s.music); FX.setVibe(s.vibe);
      if (Game.board) Game.board.setHints(s.hints);
      document.querySelectorAll('[data-set]').forEach(function (b) { b.classList.toggle('on', !!s[b.getAttribute('data-set')]); });
      document.querySelectorAll('[data-lang]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === I18N.get()); });
      this.refreshMenu();
      if (Game.st && Game.st.mode === 'daily') $('modeChip').textContent = t('modeDaily', { n: Profile.dayNumber(Game.st.day) });
    },

    /* ---------- screens ---------- */
    show: function (name) {
      this.screen = name;
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('on', s.id === name); });
      if (name === 'menu') { this.refreshMenu(); Demo.start(); Sound.play('whoosh'); }
      else Demo.stop();
      if (name === 'game') requestAnimationFrame(function () { Game.layout(); });
    },
    refreshMenu: function () {
      var save = Profile.loadGame('classic'), cont = !!(save && Profile.tutorialDone);
      $('playLabel').textContent = cont ? t('continue') : t('play');
      $('playSub').textContent = cont ? t('playCont', { s: fmt(save.score) }) : (Profile.tutorialDone ? '' : t('playFirst'));
      $('bNew').style.display = cont ? '' : 'none';
      $('menuBest').textContent = fmt(Profile.stats.best);
      $('bestPlate').style.visibility = Profile.stats.best ? '' : 'hidden';
      var day = Profile.today(), db = Profile.stats.dailyBest[day];
      $('dailyNo').textContent = t('dailyNo', { n: Profile.dayNumber(day) });
      $('dailyInfo').textContent = db ? t('dailyBest', { s: fmt(db) }) : t('dailyFresh');
      $('dailyDot').style.display = db ? 'none' : '';
      if (root.Duel) Duel.renderStatus();
    },

    /* ---------- overlays ---------- */
    open: function (name) {
      var id = 'ov' + name[0].toUpperCase() + name.slice(1), el = $(id);
      if (!el) return;
      if (name === 'settings') this.applySettings();
      if (name === 'pause') {
        var tut = !!Game.tut;
        $('pRestart').style.display = tut ? 'none' : '';
        $('pSkip').style.display = tut ? '' : 'none';
      }
      if (this.stack.indexOf(id) >= 0) return;
      this.stack.push(id); el.classList.add('on');
      if (name === 'pause' || name === 'settings') Sound.play('whoosh');
    },
    close: function () { var id = this.stack.pop(); if (id) $(id).classList.remove('on'); },
    closeAll: function () { while (this.stack.length) this.close(); },
    overlayOpen: function () { return this.stack.length > 0; },
    confirm: function (title, text, yes, cb, danger) {
      $('cTitle').textContent = title; $('cText').textContent = text; $('cYes').textContent = yes;
      $('cYes').classList.toggle('danger', !!danger);
      this.confirmCb = cb; this.open('confirm');
    },
    pause: function () {
      if (Game.isDuel()) { if (Duel.live) Duel.resign(); return; }
      if (Game.hammerArmed && !Game.st.jammed) Game.armHammer(false);
      Game.save(); this.open('pause');
    },
    appPause: function () {
      Sound.suspend(); Demo.stop();
      if (Game.isDuel() && this.screen === 'game') return; // a live duel can't be paused; the seat survives a short trip away
      if (this.screen === 'game' && Game.st && !Game.st.over && !this.overlayOpen()) this.pause();
      Game.save();
    },
    back: function () {
      if (this.stack.length) {
        var top = this.stack[this.stack.length - 1];
        if (top === 'ovJam' || top === 'ovVs') return;
        if (top === 'ovOver') { this.closeAll(); this.show('menu'); return; }
        if (top === 'ovSearch') { $('sCancel').click(); return; }
        if (top === 'ovRoom') { $('rmCancel').click(); return; }
        if (top === 'ovResult') { $('rsMenu').click(); return; }
        this.close(); return;
      }
      if (this.screen === 'online') { this.show('menu'); return; }
      if (/^(profile|top|friends|chat|dm|shop)$/.test(this.screen)) { Social.back(); return; }
      if (this.screen === 'game') { this.pause(); return; }
      if (this.screen === 'menu') { try { if (root.Android && Android.exit) Android.exit(); } catch (e) { } }
    },

    showOver: function (st, isBest) {
      var daily = st.mode === 'daily';
      $('oTitle').textContent = daily ? t('overDaily', { n: Profile.dayNumber(st.day) }) : t('overTitle');
      $('oRecord').classList.toggle('on', !!isBest);
      $('oSub').textContent = t('best') + ': ' + fmt(Profile.stats.best);
      $('oTile').textContent = fmt(st.maxTile); $('oMoves').textContent = fmt(st.moves); $('oCombo').textContent = '×' + st.run.bestCombo;
      this.open('over');
      var el = $('oScore'), t0 = performance.now(), dur = 900;
      (function tick(now) {
        var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = fmt(st.score * e);
        if (k < 1) requestAnimationFrame(tick);
      })(t0);
      if (isBest) setTimeout(function () { FX.confetti(); Sound.play('record'); FX.buzz([20, 40, 20, 40, 60]); }, 500);
      this.refreshMenu();
    },
    shareText: function (text, copyOnly) {
      var self = this;
      if (copyOnly) {
        var ok = function () { self.toast('#i-copy', t('copied'), ''); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, function () { try { Android.share(text); } catch (e) { } });
        else { try { Android.share(text); } catch (e) { } }
        return;
      }
      try {
        if (root.Android && Android.share) { Android.share(text); return; }
        if (navigator.share) { navigator.share({ text: text }).catch(function () { }); return; }
      } catch (e) { }
      var done = function () { self.toast('#i-copy', t('copied'), ''); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
    },
    share: function () {
      var st = Game.st, d = st.mode === 'daily' ? t('shareDaily', { n: Profile.dayNumber(st.day) }) : '';
      var text = t('shareText', { d: d, s: fmt(st.score), t: fmt(st.maxTile) });
      try {
        if (root.Android && Android.share) { Android.share(text); return; }
        if (navigator.share) { navigator.share({ text: text }).catch(function () { }); return; }
      } catch (e) { }
      var self = this;
      var done = function () { self.toast('#i-copy', t('copied'), ''); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
    },

    renderStats: function () {
      var s = Profile.stats, rows = [
        [fmt(s.best), 'stBest'], [fmt(s.bestTile), 'stTile'], [fmt(s.games), 'stGames'],
        ['×' + s.bestCombo, 'stCombo'], [fmt(s.merges), 'stMerges'], [fmt(s.gear), 'stGear'],
        [fmt(s.bolts), 'stBolts'], [fmt(s.streak), 'stStreak'], [fmt(s.total), 'stTotal']
      ];
      $('tabSt').innerHTML = rows.map(function (r) { return '<div class="stat"><b>' + r[0] + '</b><span>' + t(r[1]) + '</span></div>'; }).join('');
      var got = 0, html = Profile.ACH.map(function (a) {
        var d = I18N.ach(a.id), on = !!Profile.ach[a.id]; if (on) got++;
        return '<div class="ach' + (on ? ' got' : '') + '"><div class="ic">' + a.icon + '</div><div><b>' + d[0] + '</b><span>' + d[1] + '</span></div></div>';
      }).join('');
      $('tabAch').innerHTML = '<div class="ach-count">' + t('achCount', { a: got, b: Profile.ACH.length }) + '</div>' + html;
    },

    /* ---------- toasts ---------- */
    toast: function (icon, title, sub) { this.toastQ.push([icon, title, sub]); if (!this.toastBusy) this.nextToast(); },
    nextToast: function () {
      var self = this, it = this.toastQ.shift();
      if (!it) { this.toastBusy = false; return; }
      this.toastBusy = true;
      $('toastIc').innerHTML = root.PX ? PX.glyph(it[0]) : ''; $('toastT').textContent = it[1]; $('toastS').textContent = it[2];
      $('toast').classList.add('on');
      setTimeout(function () { $('toast').classList.remove('on'); setTimeout(function () { self.nextToast(); }, 450); }, 2300);
    },

    /* ---------- boot ---------- */
    boot: async function () {
      this.init();
      var bar = $('splashBar'), t0 = Date.now();
      bar.style.width = '35%';
      try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, wait(2500)]); } catch (e) { }
      bar.style.width = '75%';
      var rest = 1300 - (Date.now() - t0); if (rest > 0) await wait(rest);
      bar.style.width = '100%';
      await wait(250);
      Demo.fit();
      this.show('menu');
      Social.paintMenuAvatar();
      setTimeout(function () { Net.connect(); }, 1500);
      setTimeout(function () { $('splash').style.display = 'none'; }, 500);
    }
  };

  root.UI = UI;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { UI.boot(); });
  else UI.boot();
})(this);

</script>
</body>
</html>
